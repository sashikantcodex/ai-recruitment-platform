apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats-client
  template:
    metadata:
      labels:
        app: ats-client
    spec:
      containers:
        - name: client
          image: ats-ai-platform/client:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ats-client
spec:
  type: LoadBalancer
  selector:
    app: ats-client
  ports:
    - port: 80
      targetPort: 3000
